<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServiceFlow · 演示登录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f6fa; color: #242b3d; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 420px; padding: 36px; background: #fff; border: 1px solid #e4e7ef; border-radius: 20px; box-shadow: 0 16px 48px #1c254510; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #697386; }
    label { display: block; margin-top: 18px; font-size: 14px; }
    input, button { width: 100%; padding: 12px; border-radius: 10px; font: inherit; }
    input { margin-top: 6px; border: 1px solid #cbd2df; }
    input:focus { outline: 2px solid #8585ec; outline-offset: 2px; }
    button { margin-top: 24px; border: 0; background: #5858d6; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #error { min-height: 24px; margin-bottom: 0; color: #ba3131; font-size: 14px; }
    small { display: block; margin-top: 18px; color: #697386; }
  </style>
</head>
<body>
  <main>
    <h1>ServiceFlow</h1>
    <p>输入演示访问口令，即可体验智能客服。</p>
    <form id="login-form">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" value="demo" required>
      <label for="password">演示访问口令</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">进入聊天</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <small>口令由项目所有者提供，不是你的 DeepSeek API Key。免费实例首次唤醒可能需要等待。</small>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      const error = document.querySelector('#error');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || '登录失败，请稍后重试');
        window.location.replace('/');
      } catch (failure) {
        error.textContent = failure.message || '网络连接失败，请稍后重试';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
