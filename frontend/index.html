<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EchoMind 多智能体客服工作台" />
    <title>EchoMind · 智能客服</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">E</div>
          <div>
            <strong>EchoMind</strong>
            <span>多智能体客服</span>
          </div>
        </div>

        <button class="new-chat" id="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          新建对话
        </button>

        <section class="sidebar-section" aria-labelledby="examples-title">
          <h2 id="examples-title">试试这样问</h2>
          <div class="prompt-list">
            <button class="prompt-card" type="button" data-prompt="登录时提示错误代码 E1001，应该怎么处理？">
              <span class="prompt-icon technical" aria-hidden="true">⌁</span>
              <span><strong>排查技术问题</strong><small>登录报错 E1001</small></span>
            </button>
            <button class="prompt-card" type="button" data-prompt="我的订单被重复扣款了，退款需要多久？">
              <span class="prompt-icon billing" aria-hidden="true">¥</span>
              <span><strong>查询账单退款</strong><small>重复扣款处理</small></span>
            </button>
            <button class="prompt-card" type="button" data-prompt="请介绍一下你能帮我处理哪些问题。">
              <span class="prompt-icon general" aria-hidden="true">✦</span>
              <span><strong>了解服务范围</strong><small>认识 EchoMind</small></span>
            </button>
          </div>
        </section>

        <div class="sidebar-footer">
          <div class="service-state">
            <span class="status-dot checking" id="status-dot" aria-hidden="true"></span>
            <span id="status-text">正在连接服务</span>
          </div>
          <nav class="resource-links" aria-label="开发资源">
            <a href="/docs" target="_blank" rel="noreferrer">API 文档</a>
            <a href="/monitor" target="_blank" rel="noreferrer">运行监控</a>
          </nav>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="menu-button" id="menu-button" type="button" aria-label="打开菜单" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="topbar-title">
            <strong>智能客服</strong>
            <span id="conversation-label">新对话</span>
          </div>
          <div class="model-badge"><span aria-hidden="true"></span>DeepSeek V4 Pro</div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-orbit" aria-hidden="true">
              <span class="orbit-ring"></span>
              <span class="orbit-core">E</span>
            </div>
            <p class="eyebrow">ECHOMIND ASSISTANT</p>
            <h1>今天想解决什么问题？</h1>
            <p class="welcome-copy">描述你遇到的情况，系统会自动识别意图、选择合适的 Agent，并调用知识库与诊断工具。</p>
            <div class="capabilities" aria-label="系统能力">
              <span>智能路由</span>
              <span>上下文记忆</span>
              <span>工具追踪</span>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-wrap">
          <form class="composer" id="composer">
            <label class="sr-only" for="message-input">输入消息</label>
            <textarea id="message-input" rows="1" maxlength="4000" placeholder="输入你的问题…" autocomplete="off"></textarea>
            <button class="send-button" id="send-button" type="submit" aria-label="发送消息">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
            </button>
          </form>
          <p class="composer-hint">Enter 发送 · Shift + Enter 换行 · AI 回复仅供参考</p>
        </footer>
      </main>
    </div>

    <div class="scrim" id="scrim"></div>
    <template id="message-template">
      <article class="message">
        <div class="avatar"></div>
        <div class="message-content">
          <div class="message-role"></div>
          <div class="message-body"></div>
          <div class="message-meta"></div>
        </div>
      </article>
    </template>
    <script src="/app.js" defer></script>
  </body>
</html>
