<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="721" viewBox="0 0 1000 721" role="img" aria-labelledby="title desc">
<title id="title">对话请求处理顺序</title><desc id="desc">工作记忆写入在响应返回前；画像更新是后台任务</desc>
<rect width="1000" height="721" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="49" fill="#176c65" font-size="18" font-weight="700">SERVICEFLOW</text><text x="48" y="88" fill="#16273c" font-size="28" font-weight="700">对话请求处理顺序</text><text x="48" y="118" fill="#53647b" font-size="16">工作记忆写入在响应返回前；画像更新是后台任务</text>
<rect x="48" y="143" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="173" r="15" fill="#176c65"/><text x="79" y="179" fill="white" text-anchor="middle" font-size="16">1</text><text x="108" y="176" font-size="20" font-weight="600" fill="#16273c">接收与读取</text><text x="108" y="206" font-size="16" fill="#53647b">POST /chat → Redis / Chroma 记忆上下文</text><path d="M500 231 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="254" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="284" r="15" fill="#176c65"/><text x="79" y="290" fill="white" text-anchor="middle" font-size="16">2</text><text x="108" y="287" font-size="20" font-weight="600" fill="#16273c">识别与路由</text><text x="108" y="317" font-size="16" fill="#53647b">意图及实体 → 单角色、主辅协作、澄清或升级</text><path d="M500 342 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="365" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="395" r="15" fill="#176c65"/><text x="79" y="401" fill="white" text-anchor="middle" font-size="16">3</text><text x="108" y="398" font-size="20" font-weight="600" fill="#16273c">角色执行</text><text x="108" y="428" font-size="16" fill="#53647b">注入命中的 Skills，模型按白名单执行工具，必要时调用 RAG</text><path d="M500 453 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="476" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="506" r="15" fill="#176c65"/><text x="79" y="512" fill="white" text-anchor="middle" font-size="16">4</text><text x="108" y="509" font-size="20" font-weight="600" fill="#16273c">合成与写回</text><text x="108" y="539" font-size="16" fill="#53647b">合成回复 → 写用户及助手消息，达到阈值时压缩</text><path d="M500 564 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="587" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="617" r="15" fill="#176c65"/><text x="79" y="623" fill="white" text-anchor="middle" font-size="16">5</text><text x="108" y="620" font-size="20" font-weight="600" fill="#16273c">返回与后台更新</text><text x="108" y="650" font-size="16" fill="#53647b">返回结构化响应及 request_id；画像异步更新，不保证先完成</text>
</g></svg>
