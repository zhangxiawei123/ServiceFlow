<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="721" viewBox="0 0 1000 721" role="img" aria-labelledby="title desc">
<title id="title">本地与公网部署</title><desc id="desc">两种模式拓扑不同；本次改名不删除或迁移既有数据库</desc>
<rect width="1000" height="721" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="49" fill="#176c65" font-size="18" font-weight="700">SERVICEFLOW</text><text x="48" y="88" fill="#16273c" font-size="28" font-weight="700">本地与公网部署</text><text x="48" y="118" fill="#53647b" font-size="16">两种模式拓扑不同；本次改名不删除或迁移既有数据库</text>
<rect x="48" y="143" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="173" r="15" fill="#176c65"/><text x="79" y="179" fill="white" text-anchor="middle" font-size="16">1</text><text x="108" y="176" font-size="20" font-weight="600" fill="#16273c">本地访问入口</text><text x="108" y="206" font-size="16" fill="#53647b">浏览器 → Nginx :80 → serviceflow :8000</text><path d="M500 231 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="254" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="284" r="15" fill="#176c65"/><text x="79" y="290" fill="white" text-anchor="middle" font-size="16">2</text><text x="108" y="287" font-size="20" font-weight="600" fill="#16273c">本地依赖服务</text><text x="108" y="317" font-size="16" fill="#53647b">Redis :6379；Chroma :8001 → 容器 8000；Prometheus :9090</text><path d="M500 342 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="365" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="395" r="15" fill="#176c65"/><text x="79" y="401" fill="white" text-anchor="middle" font-size="16">3</text><text x="108" y="398" font-size="20" font-weight="600" fill="#16273c">本地持久化</text><text x="108" y="428" font-size="16" fill="#53647b">命名卷与 data 目录；保留原 Compose project name 可避免卷前缀变化</text><path d="M500 453 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="476" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="506" r="15" fill="#176c65"/><text x="79" y="512" fill="white" text-anchor="middle" font-size="16">4</text><text x="108" y="509" font-size="20" font-weight="600" fill="#16273c">公网演示</text><text x="108" y="539" font-size="16" fill="#53647b">一个 Web Service：登录网关 + 前端 + API + 嵌入式 Chroma</text><path d="M500 564 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="587" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="617" r="15" fill="#176c65"/><text x="79" y="623" fill="white" text-anchor="middle" font-size="16">5</text><text x="108" y="620" font-size="20" font-weight="600" fill="#16273c">公网依赖与边界</text><text x="108" y="650" font-size="16" fill="#53647b">Key Value；临时文件系统、单并发和模型额度限制</text>
</g></svg>
