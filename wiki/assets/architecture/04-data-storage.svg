<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="721" viewBox="0 0 1000 721" role="img" aria-labelledby="title desc">
<title id="title">数据存储分层</title><desc id="desc">以下是用途关系，不代表统一保留策略或数据自动同步</desc>
<rect width="1000" height="721" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="49" fill="#176c65" font-size="18" font-weight="700">SERVICEFLOW</text><text x="48" y="88" fill="#16273c" font-size="28" font-weight="700">数据存储分层</text><text x="48" y="118" fill="#53647b" font-size="16">以下是用途关系，不代表统一保留策略或数据自动同步</text>
<rect x="48" y="143" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="173" r="15" fill="#176c65"/><text x="79" y="179" fill="white" text-anchor="middle" font-size="16">1</text><text x="108" y="176" font-size="20" font-weight="600" fill="#16273c">Redis</text><text x="108" y="206" font-size="16" fill="#53647b">近期消息、滚动摘要；工作记忆默认 TTL 24 小时</text><path d="M500 231 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="254" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="284" r="15" fill="#176c65"/><text x="79" y="290" fill="white" text-anchor="middle" font-size="16">2</text><text x="108" y="287" font-size="20" font-weight="600" fill="#16273c">Chroma knowledge_base</text><text x="108" y="317" font-size="16" fill="#53647b">文档片段及向量，知识为空时加载示例</text><path d="M500 342 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="365" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="395" r="15" fill="#176c65"/><text x="79" y="401" fill="white" text-anchor="middle" font-size="16">3</text><text x="108" y="398" font-size="20" font-weight="600" fill="#16273c">Chroma episodic</text><text x="108" y="428" font-size="16" fill="#53647b">情景摘要；按用户限定范围，优先同会话</text><path d="M500 453 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="476" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="506" r="15" fill="#176c65"/><text x="79" y="512" fill="white" text-anchor="middle" font-size="16">4</text><text x="108" y="509" font-size="20" font-weight="600" fill="#16273c">Chroma user_profile</text><text x="108" y="539" font-size="16" fill="#53647b">画像通过稳定文档 ID upsert；更新在后台进行</text><path d="M500 564 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="587" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="617" r="15" fill="#176c65"/><text x="79" y="623" fill="white" text-anchor="middle" font-size="16">5</text><text x="108" y="620" font-size="20" font-weight="600" fill="#16273c">配置与部署</text><text x="108" y="650" font-size="16" fill="#53647b">Skills 文件、评测基线；公网临时磁盘不能视为可靠长期存储</text>
</g></svg>
