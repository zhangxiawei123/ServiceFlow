<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="721" viewBox="0 0 1000 721" role="img" aria-labelledby="title desc">
<title id="title">角色、规则和工具边界</title><desc id="desc">Skills 是提示词规则；实际权限由代码控制</desc>
<rect width="1000" height="721" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="49" fill="#176c65" font-size="18" font-weight="700">SERVICEFLOW</text><text x="48" y="88" fill="#16273c" font-size="28" font-weight="700">角色、规则和工具边界</text><text x="48" y="118" fill="#53647b" font-size="16">Skills 是提示词规则；实际权限由代码控制</text>
<rect x="48" y="143" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="173" r="15" fill="#176c65"/><text x="79" y="179" fill="white" text-anchor="middle" font-size="16">1</text><text x="108" y="176" font-size="20" font-weight="600" fill="#16273c">识别结果</text><text x="108" y="206" font-size="16" fill="#53647b">用户问题、历史、意图、实体和紧急度</text><path d="M500 231 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="254" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="284" r="15" fill="#176c65"/><text x="79" y="290" fill="white" text-anchor="middle" font-size="16">2</text><text x="108" y="287" font-size="20" font-weight="600" fill="#16273c">选择角色</text><text x="108" y="317" font-size="16" fill="#53647b">General / Technical / Billing / Escalation；需要时主辅协作</text><path d="M500 342 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="365" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="395" r="15" fill="#176c65"/><text x="79" y="401" fill="white" text-anchor="middle" font-size="16">3</text><text x="108" y="398" font-size="20" font-weight="600" fill="#16273c">匹配规则</text><text x="108" y="428" font-size="16" fill="#53647b">从本地文件按 agents 和 keywords 匹配，受字符预算限制</text><path d="M500 453 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="476" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="506" r="15" fill="#176c65"/><text x="79" y="512" fill="white" text-anchor="middle" font-size="16">4</text><text x="108" y="509" font-size="20" font-weight="600" fill="#16273c">调用工具</text><text x="108" y="539" font-size="16" fill="#53647b">角色白名单 + 输入校验 + 有限轮次 → tool_result</text><path d="M500 564 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="587" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="617" r="15" fill="#176c65"/><text x="79" y="623" fill="white" text-anchor="middle" font-size="16">5</text><text x="108" y="620" font-size="20" font-weight="600" fill="#16273c">生成与交接</text><text x="108" y="650" font-size="16" fill="#53647b">回复或结构化交接摘要；不执行真实退款或创建外部工单</text>
</g></svg>
