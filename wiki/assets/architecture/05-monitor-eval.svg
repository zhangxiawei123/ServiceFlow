<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="721" viewBox="0 0 1000 721" role="img" aria-labelledby="title desc">
<title id="title">观测和评测职责</title><desc id="desc">在线统计与离线质量实验互补，不能互相代替</desc>
<rect width="1000" height="721" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="48" y="49" fill="#176c65" font-size="18" font-weight="700">SERVICEFLOW</text><text x="48" y="88" fill="#16273c" font-size="28" font-weight="700">观测和评测职责</text><text x="48" y="118" fill="#53647b" font-size="16">在线统计与离线质量实验互补，不能互相代替</text>
<rect x="48" y="143" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="173" r="15" fill="#176c65"/><text x="79" y="179" fill="white" text-anchor="middle" font-size="16">1</text><text x="108" y="176" font-size="20" font-weight="600" fill="#16273c">请求证据</text><text x="108" y="206" font-size="16" fill="#53647b">request_id、角色、工具结果、错误与耗时</text><path d="M500 231 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="254" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="284" r="15" fill="#176c65"/><text x="79" y="290" fill="white" text-anchor="middle" font-size="16">2</text><text x="108" y="287" font-size="20" font-weight="600" fill="#16273c">在线 Monitor</text><text x="108" y="317" font-size="16" fill="#53647b">读取统计、阈值与异常检测、告警及路由惩罚</text><path d="M500 342 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="365" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="395" r="15" fill="#176c65"/><text x="79" y="401" fill="white" text-anchor="middle" font-size="16">3</text><text x="108" y="398" font-size="20" font-weight="600" fill="#16273c">离线 Evaluator</text><text x="108" y="428" font-size="16" fill="#53647b">固定意图样本与对话 → 分类指标与四维 Judge</text><path d="M500 453 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="476" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="506" r="15" fill="#176c65"/><text x="79" y="512" fill="white" text-anchor="middle" font-size="16">4</text><text x="108" y="509" font-size="20" font-weight="600" fill="#16273c">审核与回归</text><text x="108" y="539" font-size="16" fill="#53647b">标记解析失败；比较基线，人工复核失败案例</text><path d="M500 564 v15 m-5 -5 5 5 5 -5" fill="none" stroke="#176c65" stroke-width="2"/>
<rect x="48" y="587" width="904" height="85" rx="12" fill="white" stroke="#ccd9e6"/><circle cx="79" cy="617" r="15" fill="#176c65"/><text x="79" y="623" fill="white" text-anchor="middle" font-size="16">5</text><text x="108" y="620" font-size="20" font-weight="600" fill="#16273c">优化验证</text><text x="108" y="650" font-size="16" fill="#53647b">固定数据集比较质量、P95 和费用；未测量不声明提升</text>
</g></svg>
